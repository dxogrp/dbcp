[project]
name = "dbcp"
version = "1.0.0"
description = "A CVXPY extension for disciplined biconvex programming."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Hao Zhu", email = "zhuh@cs.uni-freiburg.de" },
    { name = "Joschka Boedecker" },
]
keywords = [
    "convex optimization",
    "disciplined convex programming",
    "biconvex optimization",
    "disciplined biconvex programming",
]
requires-python = ">=3.12"
dependencies = [
    "cvxpy>=1.9",
    "numpy>=2.3.3",
]

[project.urls]
Repository = "https://github.com/dxogrp/dbcp"
Documentation = "https://dxogrp.github.io/dbcp/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbcp"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/dbcp",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[dependency-groups]
dev = [
    "packaging>=25",
    "pytest>=8.4",
    "ruff>=0.12",
]
examples = [
    "marimo>=0.24.0",
    "matplotlib>=3.9",
    "scikit-learn>=1.9",
]
docs = [
    "alabaster>=1,<2",
    "myst-parser>=5.1,<6",
    "sphinx>=9.1,<10",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
